[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openm454"
dynamic = ["version"]
description = "Open driver, CLI and MCP server for the DreamSourceLab DSCope M454 USB oscilloscope (v3 protocol), made for AI agents"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["libusb1>=3.1", "numpy>=1.24", "matplotlib>=3.7", "lz4>=4.0"]
keywords = ["oscilloscope", "logic analyzer", "dscope", "m454", "usb", "mcp", "agent", "measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://github.com/FrostFlops/openm454"
Issues = "https://github.com/FrostFlops/openm454/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
openm454 = "openm454.cli:main"
openm454-mcp = "openm454.mcp_server:main"

[tool.setuptools]
packages = ["openm454"]

[tool.setuptools.dynamic]
version = {attr = "openm454.__version__"}

[tool.pytest.ini_options]
markers = ["hw: needs the DSCope M454 connected and DSWave closed"]
addopts = "-m 'not hw'"   # tests marked hw need the scope; they run only on request (pytest -m hw)
